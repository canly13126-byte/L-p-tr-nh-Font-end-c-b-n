<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hiện tạo todolist</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            padding-top: 50px;
        }
        .todo-container {
            width: 360px;
            background-color: #2d3748;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            color: #ffffff;
        }
        .todo-header {
            background-color: #c53030;
            padding: 20px;
            text-align: center;
        }
        .todo-header h2 {
            margin: 0 0 15px 0;
            font-size: 16px;
            font-weight: bold;
        }
        .input-group {
            display: flex;
            gap: 5px;
        }
        .input-group input {
            flex: 1;
            padding: 8px 12px;
            border: none;
            outline: none;
            font-size: 14px;
        }
        .input-group button {
            background-color: #e2e8f0;
            color: #000000;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
        .todo-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .todo-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            border-bottom: 1px solid #4a5568;
        }
        .todo-content {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            flex: 1;
        }
        .todo-item.completed .text {
            text-decoration: line-through;
            color: #a0aec0;
        }
        .check-icon {
            color: #48bb78;
            font-weight: bold;
            visibility: hidden;
        }
        .todo-item.completed .check-icon {
            visibility: visible;
        }
        .delete-btn {
            background: none;
            border: none;
            color: #f56565;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            padding: 0 5px;
        }
    </style>
</head>
<body>

    <div class="todo-container">
        <div class="todo-header">
            <h2>Danh sách những việc cần làm trong năm</h2>
            <div class="input-group">
                <input type="text" id="todo-input" placeholder="Title...">
                <button id="add-btn">Thêm</button>
            </div>
        </div>
        <ul class="todo-list" id="todo-list"></ul>
    </div>

    <script src="baitap3ss18.js"></script>
</body>
</html>
