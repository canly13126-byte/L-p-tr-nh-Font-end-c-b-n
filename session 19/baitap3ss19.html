<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="baitap3ss19.css">
</head>
<body>

<div class="login-container">
    <h2>Login</h2>
    <form id="loginForm">
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="text" id="email" placeholder="Enter your email address">
        </div>
        
        <div class="form-group">
            <label for="password">Password:</label>
            <div class="password-wrapper">
                <input type="password" id="password" placeholder="Enter your password">
                <button type="button" id="togglePassword">Hiện</button>
            </div>
        </div>

        <div class="form-options">
            <label class="remember-me">
                <input type="checkbox" id="rememberMe"> Ghi nhớ tài khoản
            </label>
        </div>
        
        <button type="submit" id="loginBtn">Login</button>
    </form>

    <div class="form-footer">
        <a href="#" class="forgot-link">Forgot password?</a>
        <span class="divider">or</span>
        <a href="baitap1ss19.html" class="signup-link">SignUp</a>
    </div>
</div>

<script src="baitap3ss19.js"></script>
</body>
</html>
