<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Change background color</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            display: flex;
            gap: 20px;
        }
        .box {
            width: 100px;
            height: 100px;
            cursor: pointer;
            border: 2px solid #000;
        }
        #box-yellow { background-color: yellow; }
        #box-green { background-color: green; }
        #box-gray { background-color: gray; }
    </style>
</head>
<body>

    <div class="container">
        <div id="box-yellow" class="box"></div>
        <div id="box-green" class="box"></div>
        <div id="box-gray" class="box"></div>
    </div>

    <script src="baitap4ss17.js"></script>
</body>
</html>
