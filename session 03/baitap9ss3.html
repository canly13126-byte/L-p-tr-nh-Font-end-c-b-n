<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Tìm kiếm sản phẩm</title>
</head>

<body>

    <h1>Tìm Kiếm Sản Phẩm</h1>

    <form>

        <label for="tukhoa">Từ khóa tìm kiếm:</label>
        <br>
        <input type="text" id="tukhoa" name="tukhoa">

        <br><br>

        <label for="loai">Loại sản phẩm:</label>
        <br>

        <select id="loai" name="loai">
            <option>Điện tử</option>
            <option>Thời trang</option>
            <option>Sách</option>
            <option>Gia dụng</option>
        </select>

        <br><br>

        <input type="submit" value="Tìm kiếm">

    </form>

</body>

</html>
