<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Tạo table sử dụng thuộc tính colspan </title>
    <style>
        table {
            border: 2px solid gray;
            border-spacing: 20px;
            padding: 10px;
        }

        th,
        td {
            border: 2px solid gray;
            padding: 25px;
            font-size: 30px;
            text-align: center;
        }

        th {
            font-weight: bold;
        }
    </style>
</head>

<body>
    <table>
        <tr>
            <th>Tháng</th>
            <th colspan="2">Tỷ lệ đơn hàng theo tháng</th>
        </tr>
        <tr>
            <td>Nguyễn Văn A</td>
            <td>15% hoàn thành</td>
            <td>85% hủy hàng</td>
        </tr>
        <tr>
            <td>phan văn b</td>
            <td>25% hoàn thành</td>
            <td>75% hủy hàng</td>
        </tr>
        <tr>
            <td>Nguyễn thị c</td>
            <td>50% hoàn thành</td>
            <td>50% hủy hàng</td>
        </tr>
    </table>
</body>

</html>
