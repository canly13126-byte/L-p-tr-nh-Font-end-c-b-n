<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Tạo một table đơn giản </title>
    <style>
        table {
            border: 2px solid gray;
            border-spacing: 20px;
            padding: 10px;
        }

        th,
        td {
            border: 2px solid gray;
            padding: 25px;
            font-size: 30px;
            text-align: center;
        }

        th {
            font-weight: bold;
        }
    </style>
</head>

<body>
    <table>
        <tr>
            <th>Tên</th>
            <th>Tuổi</th>
            <th>Nghề Nghiệp</th>
        </tr>
        <tr>
            <td>An</td>
            <td>25</td>
            <td>Lập trình viên</td>
        </tr>
        <tr>
            <td>Bảo</td>
            <td>25</td>
            <td>Kỹ sư xây dựng</td>
        </tr>
        <tr>
            <td>Chi</td>
            <td>22</td>
            <td>sinh viên</td>
        </tr>
    </table>
</body>

</html>
